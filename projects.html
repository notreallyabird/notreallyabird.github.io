
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Projects | Kendall Binkley</title>

  <style>
    :root {
      --bg: #0D0D0F;
      --panel: #202226;
      --panel-hover: #292B30;
      --text: #F1EDE6;
      --muted: #A7A9AF;
      --accent: #B8202F;
      --red-bright: #E13B49;
      --line: #393A40;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, 90%);
      margin: 0 auto;
    }

    nav {
      padding: 22px 0;
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-weight: 800;
      letter-spacing: 1px;
    }

    .back-link {
      color: var(--muted);
    }

    .back-link:hover {
      color: var(--red-bright);
    }

    header {
      padding: 80px 0 45px;
    }

    .eyebrow {
      color: var(--red-bright);
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      line-height: 1.05;
    }

    .intro {
      max-width: 650px;
      color: var(--muted);
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      padding-bottom: 80px;
    }

    .project {
      overflow: hidden;
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      transition: border-color 0.2s, transform 0.2s;
    }

    .project:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
    }

    .project-image {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-bottom: 18px;
      background: #17181B;
      border: 1px solid var(--line);
      object-fit: cover;
    }

    .project h2 {
      margin: 0 0 10px;
      font-size: 1.4rem;
    }

    .project p {
      color: var(--muted);
    }

    .project-link {
      display: block;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    .project-link:hover {
      background: var(--panel-hover);
      transform: translateY(-4px);
    }

    .project-link:focus-visible {
      outline: 2px solid var(--red-bright);
      outline-offset: 4px;
    }

    .tag {
      display: inline-block;
      margin: 4px 4px 0 0;
      padding: 4px 9px;
      color: var(--text);
      background: #303137;
      font-size: 0.78rem;
    }

    footer {
      padding: 25px 0;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 0.9rem;
    }

    @media (max-width: 650px) {
      .project-grid {
        grid-template-columns: 1fr;
      }

      header {
        padding-top: 55px;
      }
    }
  </style>
</head>

<body>
  <nav>
    <div class="container nav-inner">
      <a class="brand" href="index.html">KB / ENGINEERING</a>
      <a class="back-link" href="index.html">← Back to Home</a>
    </div>
  </nav>

  <main class="container">
    <header>
      <div class="eyebrow">Engineering Portfolio</div>
      <h1>All Projects.</h1>
      <p class="intro">
        A collection of all of my engineering projects, spanning robotics,
        mechanical design, fabrication, electronics, and research.
      </p>
    </header>

    <section class="project-grid">

    <a href="project_folder/project_1.html" class="project project-link"> <img class="project-image" src="images/frc-robot.jpg" alt="FRC robot">
      <h2>Project 1</h2>
      <p> 
        TEXT
      </p>
      <span class="tag">CAD</span>
      <span class="tag">Fabrication</span>
      <span class="tag">Robotics</span>
    </a>

      <!-- Copy a project article to add more projects here. -->

    </section>
  </main>

  <footer>
    <div class="container">
      © 2026 Kendall Binkley · Engineering Portfolio
    </div>
  </footer>
</body>
</html>
